name: ScrollMe CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['scrollme/**', '.github/workflows/scrollme.yml']
  pull_request:
    paths: ['scrollme/**', '.github/workflows/scrollme.yml']

permissions:
  contents: read

concurrency:
  group: scrollme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, tests, audit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scrollme/backend } }
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scrollme/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Storefront — lint, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scrollme } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scrollme/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run lint-check
      - run: npm run test:ci
        env: { CI: true }
      - run: npm run build
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-build
          path: scrollme/build
          retention-days: 7

  e2e:
    name: End-to-end (browser) tests
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: storefront-build
          path: scrollme/build
      - run: npm ci --no-audit --no-fund
        working-directory: scrollme/backend
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: scrollme/e2e
      - run: npx playwright test
        working-directory: scrollme/e2e
        env:
          CI: true
          E2E_MONGODB_URI: mongodb://localhost:27017/scrollme_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            scrollme/e2e/playwright-report
            scrollme/e2e/test-results
          retention-days: 7

  docker:
    name: Docker images build
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: scrollme/backend
          push: false
          tags: scrollme-api:ci
      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: scrollme
          push: false
          tags: scrollme-web:ci
